[project]
name = "harmony-variable-fan-out"
dynamic = ["version"]
requires-python = ">=3.14"
dependencies = [
    "h5netcdf>=1.8.1",
    "harmony-service-lib>=3.0.0",
    "net2cog>=1.4.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "xarray>=2026.9.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest]
pythonpath = ["."]

# Only here so uv can read the version; the project itself is never built or installed.
[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
version = {file = "docker/service_version.txt"}
